<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b0840"/>
      <stop offset="55%" stop-color="#0d0c34"/>
      <stop offset="100%" stop-color="#050410"/>
    </linearGradient>
    <radialGradient id="mn" cx="248" cy="255" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffef4"/>
      <stop offset="35%" stop-color="#fde68a"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="pl" cx="345" cy="345" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <filter id="glw" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <mask id="cm">
      <rect width="512" height="512" fill="white"/>
      <circle cx="183" cy="242" r="102" fill="black"/>
    </mask>
    <clipPath id="rf">
      <rect x="304" y="358" width="112" height="22"/>
    </clipPath>
  </defs>

  <!-- Background: deep space -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Nebula blobs -->
  <ellipse cx="160" cy="158" rx="200" ry="150" fill="#7c3aed" opacity="0.09"/>
  <ellipse cx="372" cy="372" rx="155" ry="112" fill="#0891b2" opacity="0.07"/>

  <!-- Stars -->
  <circle cx="65"  cy="52"  r="2"   fill="white" opacity="0.82"/>
  <circle cx="142" cy="36"  r="1.3" fill="white" opacity="0.62"/>
  <circle cx="390" cy="44"  r="1.8" fill="white" opacity="0.74"/>
  <circle cx="454" cy="86"  r="1.3" fill="white" opacity="0.54"/>
  <circle cx="46"  cy="196" r="2.3" fill="white" opacity="0.78"/>
  <circle cx="472" cy="168" r="1.6" fill="white" opacity="0.62"/>
  <circle cx="55"  cy="352" r="1.5" fill="white" opacity="0.58"/>
  <circle cx="466" cy="374" r="2"   fill="white" opacity="0.68"/>
  <circle cx="105" cy="456" r="1.5" fill="white" opacity="0.48"/>
  <circle cx="404" cy="464" r="1.3" fill="white" opacity="0.52"/>
  <circle cx="330" cy="72"  r="1.5" fill="white" opacity="0.68"/>
  <circle cx="486" cy="302" r="1.3" fill="white" opacity="0.48"/>
  <circle cx="36"  cy="268" r="1.5" fill="white" opacity="0.58"/>
  <circle cx="488" cy="444" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="200" cy="460" r="1.2" fill="white" opacity="0.44"/>
  <circle cx="22"  cy="360" r="1.4" fill="white" opacity="0.46"/>

  <!-- 4-pointed sparkle star (top right) -->
  <path d="M418,80 L422,95 L437,99 L422,103 L418,118 L414,103 L399,99 L414,95 Z"
        fill="white" opacity="0.82" filter="url(#sg)"/>

  <!-- Small sparkle (left middle) -->
  <path d="M95,197 L97.5,204 L105,206.5 L97.5,209 L95,216 L92.5,209 L85,206.5 L92.5,204 Z"
        fill="white" opacity="0.52" filter="url(#sg)"/>

  <!-- Moon glow (soft warm halo) -->
  <circle cx="248" cy="255" r="135" fill="#fde68a" opacity="0.14" filter="url(#glw)"/>

  <!-- Crescent moon body -->
  <circle cx="248" cy="255" r="115" fill="url(#mn)" mask="url(#cm)"/>

  <!-- Subtle craters (only visible in illuminated crescent) -->
  <circle cx="290" cy="228" r="16" fill="#92400e" opacity="0.18" mask="url(#cm)"/>
  <circle cx="312" cy="285" r="11" fill="#92400e" opacity="0.14" mask="url(#cm)"/>
  <circle cx="276" cy="318" r="7"  fill="#92400e" opacity="0.16" mask="url(#cm)"/>

  <!-- Small planet with ring -->
  <!-- Ring back part (behind planet) -->
  <ellipse cx="360" cy="360" rx="50" ry="12" fill="none" stroke="#3730a3"
           stroke-width="7" opacity="0.35" transform="rotate(-20,360,360)"/>
  <!-- Planet body -->
  <circle cx="360" cy="360" r="30" fill="url(#pl)"/>
  <!-- Planet highlight -->
  <ellipse cx="350" cy="350" rx="10" ry="7" fill="white" opacity="0.2"/>
  <!-- Ring front arc (on top of planet) -->
  <ellipse cx="360" cy="360" rx="50" ry="12" fill="none" stroke="#8b5cf6"
           stroke-width="4.5" opacity="0.78" transform="rotate(-20,360,360)"
           clip-path="url(#rf)"/>
</svg>
